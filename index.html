        body {
            background-color: #0e0e10;
            color: #e0e0e0;
        }

        .header {
            width: 100%;
            height: 10vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            position: fixed;
            top: 20px;
            width: 70%;
            height: 3%;
            z-index: 100;

            background: rgba(18, 18, 18, 0.2);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 30px rgba(0, 255, 255, 0.1),
            0 4px 10px rgba(0, 0, 0, 0.6);
        }

        .nav-bar .logo {
            font-family: "Orbitron", sans-serif;
            font-size: 28px;
            color: #00fff0;
            letter-spacing: 1.5px;
            text-shadow: 0 0 12px rgba(0, 255, 240, 0.5);
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #e0e0e0;
            font-weight: 500;
            font-size: 16px;
            font-family: "Exo", sans-serif;
            position: relative;
            transition: all 0.3s ease;
        }

        .nav-links a:not(.btn)::after {
            content: '';
            position: absolute;
            width: 0%;
            height: 2px;
            bottom: -4px;
            left: 0;
            background: linear-gradient(90deg, #00f5c9, #5f72be);
            transition: 0.3s ease;
        }

        .nav-links a:hover {
            color: #00f5c9;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links .btn {
            padding: 10px 24px;
            border: none;
            background: linear-gradient(135deg, #00f5c9, #5f72be);
            color: #0f0f0f;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(0, 255, 240, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .nav-links .btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 25px rgba(0, 255, 240, 0.7),
            0 0 50px rgba(95, 114, 190, 0.5);
        }
    </style>
