    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #0e0e10;
            color: #e0e0e0;
        }

        .header {
            width: 100%;
            height: 10vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            position: fixed;
            top: 20px;
            width: 70%;
            height: 3%;
            z-index: 100;

            background: rgba(18, 18, 18, 0.2);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 30px rgba(0, 255, 255, 0.1),
            0 4px 10px rgba(0, 0, 0, 0.6);
        }

        .nav-bar .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: #00fff0;
            letter-spacing: 1.5px;
            text-shadow: 0 0 12px rgba(0, 255, 240, 0.5);
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #00f5c9;
            font-weight: 500;
            font-size: 16px;
            font-family: 'Exo', sans-serif;
            position: relative;
            transition: all 0.3s ease;
        }

        .nav-links a:not(.btn)::after {
            content: '';
            position: absolute;
            width: 0%;
            height: 2px;
            bottom: -4px;
            left: 0;
            background: linear-gradient(90deg, #00f5c9, #ea82af);
            transition: 0.3s ease;
        }

        .nav-links a:hover {
            color: #00f5c9;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links .btn {
            padding: 10px 24px;
            border: none;
            background: linear-gradient(135deg, #00f5c9, #ea82af);
            color: #0f0f0f;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(0, 255, 240, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .nav-links .btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 25px rgba(0, 255, 240, 0.7),
            0 0 50px rgba(95, 114, 190, 0.5);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
        }

        .menu-icon {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 25px;
            height: 18px;
            cursor: pointer;
            z-index: 100;
        }

        .menu-icon span {
            height: 1px;
            width: 100%;
            background: #00f5c9;
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            .menu-icon {
                display: flex;
            }

            #menu-toggle:checked + .menu-icon span:nth-child(1) {
                transform: rotate(45deg) translate(5px, 5px);
            }

            #menu-toggle:checked + .menu-icon span:nth-child(2) {
                opacity: 0;
            }

            #menu-toggle:checked + .menu-icon span:nth-child(3) {
                transform: rotate(-45deg) translate(7px, -7px);
            }
        }

        .hero {
            position: relative;
            width: 100%;
            height: calc(100vh - 10vh);
            /*background: #1a1a1d;*/
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: #fff;
            text-align: center;
        }

        .hero::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60%;
            aspect-ratio: 1/1;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(0, 245, 201, 0.3), transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: cyberPulse 5s infinite ease-in-out;
            opacity: 1;
            filter: blur(120px);
        }

        @keyframes cyberPulse {
            0% {
                transform: translate(-50%, -50%) scale(0.9);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 1; /* Make it more intense */
            }
            100% {
                transform: translate(-50%, -50%) scale(0.9);
                opacity: 0.6;
            }
        }

        .hero::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60%;
            aspect-ratio: 1/1;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 0, 200, 0.15), transparent 70%);
            z-index: 0;
            pointer-events: none;
            filter: blur(100px);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            padding: 20px;
            max-width: 800px;
        }

        .name {
            font-size: 5em;
            font-family: 'Orbitron', sans-serif;
            margin-top: 120px;
            margin-bottom: 20px;
            letter-spacing: 5px;
            text-shadow: 0 0 10px #00f5c9, 0 0 20px #00f5c9, 0 0 30px #00f5c9, 0 0 40px #00f5c9;
            animation: flicker 3s infinite alternate;
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
                text-shadow: 0 0 8px #00f5c9, 0 0 15px #00f5c980;
            }
            20%, 22%, 24%, 55% {
                opacity: 0.85;
                text-shadow: none;
            }
        }

        .roles {
            font-size: 2em;
            font-family: 'Exo', sans-serif;
            margin-top: 20px;
            color: transparent;
            background-clip: text;
            /*color: #00f5c9;*/
            display: flex;
            justify-content: center;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 2.2em;
        }

        .role {
            background: linear-gradient(to right, #00f5c9, #ea82af, #00f5c9);
            color: transparent;
            background-clip: text;
            font-family: 'Michroma',serif;
            opacity: 0;
            position: absolute;
            white-space: nowrap;
            height: 2em;
            top: 10px;
            left: 0;
            right: 0;
            animation: fadeCycle 9s infinite;
        }

        @keyframes fadeCycle {
            0%, 100% { opacity: 0; }
            10%, 30% { opacity: 1; }
            40%, 90% { opacity: 0; }
        }

        .role:nth-child(1) {
            animation-delay: 0s;
        }

        .role:nth-child(2) {
            animation-delay: 3s;
        }

        .role:nth-child(3) {
            animation-delay: 6s;
        }

        .description {
            font-size: 1.2em;
            margin-bottom: 30px;
            font-family: 'Exo', sans-serif;
            color: #90f6e1;
            line-height: 1.6;
        }

        .divider {
            width: 380px;
            height: 4px;
            background: #ea82af;
            margin: 20px auto;
            box-shadow: 0 0 10px #ea82af;
        }

        @media (max-width: 768px) {
            .name {
                font-size: 3em;
            }

            .roles {
                font-size: 1.5em;
            }

            .description {
                font-size: 1em;
            }
        }

        .cta-circle {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #ea82af;
            font-weight: 600;
            letter-spacing: 1px;
            font-family: 'Exo', sans-serif;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .circle-icon {
            width: 35px;
            aspect-ratio: 1/1;
            border: 1px solid #ea82af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circle-icon i {
            font-size: 16px;
            color: #ea82af;
        }

        .circle-icon:hover {
            animation: bounce 0.6s ease;
        }

        @keyframes bounce {
            0%   { transform: translateY(0); }
            25%  { transform: translateY(-4px); }
            75% { transform: translateY(4px); }
            100% { transform: translateY(0); }
        }

        .cta-circle:hover .circle-icon i {
            color: #ea82af;
        }

        @media (max-width: 480px) {
            .name {
                font-size: 2.5em;
                margin-top: 100px;
            }
            .roles {
                font-size: 1.2em;
            }
            .cta-circle {
                font-size: 0.85rem;
            }
        }
    </style>
